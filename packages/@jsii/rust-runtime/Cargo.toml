[package]
name = "jsii-runtime"
version = "0.0.0"
edition = "2021"
description = "Rust runtime for jsii"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0" 