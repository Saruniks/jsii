[package]
name = "jsii-rust-runtime-test"
version = "0.0.0"
edition = "2021"

[dependencies]
# Jsii runtime (will be implemented)
jsii-runtime = { path = "../../rust-runtime" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
# Testing framework
tokio-test = "0.4"

[features]
default = [] 